<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bebe Alex — Photo Album</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="icon" href="favicon-16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2a3540;
      --muted: #5c6b78;
      --paper: #eef4f7;
      --panel: rgba(255, 255, 255, 0.72);
      --accent: #4a8fa8;
      --accent-soft: #b8d9e6;
      --ring: #7eb6c9;
      --shadow: 0 18px 40px rgba(42, 53, 64, 0.12);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Nunito", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 60% at 10% -10%, #d7ebf3 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 100% 0%, #cfe4d8 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 50% 100%, #e8f0f5 0%, transparent 55%),
        linear-gradient(165deg, #e6f0f5 0%, #f2f7f9 45%, #e9f2ec 100%);
      background-attachment: fixed;
    }

    .wrap {
      width: min(1120px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 3.5rem;
    }

    header.album-head {
      text-align: center;
      margin-bottom: 2rem;
      animation: rise 0.7s ease both;
    }

    header.album-head h1 {
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: clamp(2.1rem, 5vw, 3.2rem);
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.1;
    }

    header.album-head p {
      margin-top: 0.55rem;
      color: var(--muted);
      font-size: 1.05rem;
      font-weight: 400;
    }

    .viewer {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 1.25rem;
      align-items: stretch;
      margin-bottom: 1.75rem;
      animation: rise 0.85s 0.08s ease both;
    }

    .stage {
      position: relative;
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      aspect-ratio: 4 / 3;
      width: 100%;
    }

    .stage img {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: zoom-in;
      transition: opacity 0.35s ease, transform 0.55s ease;
    }

    .stage img.is-switching {
      opacity: 0.35;
      transform: scale(1.015);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: rgba(18, 28, 36, 0.88);
      backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s ease, visibility 0.25s ease;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .lightbox img {
      max-width: min(100%, 1400px);
      max-height: calc(100vh - 2.5rem);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      cursor: zoom-out;
      transform: scale(0.97);
      transition: transform 0.25s ease;
    }

    .lightbox.open img {
      transform: scale(1);
    }

    .lightbox-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .lightbox-close:hover {
      background: #fff;
      transform: scale(1.06);
    }

    body.lightbox-open {
      overflow: hidden;
    }

    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(42, 53, 64, 0.15);
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .nav-btn:hover { background: #fff; transform: translateY(-50%) scale(1.06); }
    .nav-btn.prev { left: 0.85rem; }
    .nav-btn.next { right: 0.85rem; }

    .meta {
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.6rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.85rem;
    }

    .meta .count {
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .meta h2 {
      font-family: "Fraunces", serif;
      font-size: clamp(1.45rem, 2.5vw, 1.9rem);
      font-weight: 700;
      line-height: 1.2;
      animation: fadeSlide 0.35s ease;
    }

    .meta p {
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.55;
      animation: fadeSlide 0.4s ease;
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 0.75rem;
      animation: rise 1s 0.15s ease both;
    }

    .thumb {
      appearance: none;
      border: 2px solid transparent;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      background: #fff;
      aspect-ratio: 4 / 3;
      box-shadow: 0 6px 14px rgba(42, 53, 64, 0.08);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .thumb img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumb:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(42, 53, 64, 0.14);
    }

    .thumb.active {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px rgba(126, 182, 201, 0.35), 0 10px 20px rgba(42, 53, 64, 0.12);
      transform: translateY(-2px);
    }

    .thumb:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    footer {
      margin-top: 2rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      animation: rise 1.1s 0.2s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 820px) {
      .viewer { grid-template-columns: 1fr; }
      .stage { aspect-ratio: 4 / 3; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="album-head">
      <h1>Bebe Alex</h1>
      <p>Un album mic pentru un baietel mic</p>
    </header>

    <section class="viewer" aria-label="Selected photo">
      <div class="stage">
        <img id="mainImage" src="images/image01.jpg" alt="" />
        <button class="nav-btn prev" type="button" aria-label="Previous photo">‹</button>
        <button class="nav-btn next" type="button" aria-label="Next photo">›</button>
      </div>
      <aside class="meta">
        <div class="count" id="photoCount">Photo 1 of 12</div>
        <h2 id="photoTitle">Bebe Alex</h2>
        <p id="photoDesc">26 de zile</p>
      </aside>
    </section>

    <section class="thumbs" id="thumbs" aria-label="Photo thumbnails"></section>

    <footer>Copyright (c) 2o26, adrianus.ro</footer>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Full size photo" hidden>
    <button class="lightbox-close" type="button" aria-label="Close full size photo">×</button>
    <img id="lightboxImage" src="" alt="" />
  </div>

  <script>
    const photos = [
      { src: "images/image01.jpg", title: "Bebe Alex", description: "26 de zile" },
      { src: "images/image02.jpg", title: "2 Bebes", description: "Bebe Alex & Bebe Dex impreuna" },
      { src: "images/image03.jpg", title: "La discoteca", description: "Prima noapte din spital, singura petrecuta la aparatul UV" },
      { src: "images/image04.jpg", title: "La plimbare", description: "La plimbare prin curte" },
      { src: "images/image05.jpg", title: "Overview", description: "Splendoare langa iarba" },
      { src: "images/image06.jpg", title: "Agent watching", description: "Fiecare se uita la ce vrea" },
      { src: "images/image07.jpg", title: "Yo quero Taco Bell", description: "Unde e burrito-ul meu?" },
      { src: "images/image08.jpg", title: "Tom Degetel", description: "As it turns out, cel mai gustos lucru, e propria mana" },
      { src: "images/image09.jpg", title: "Un lux nepermis", description: "Macar ei doi sa doarma, nimeni altcineva nu o mai face" },
      { src: "images/image10.jpg", title: "Buna dimineata", description: "Bebe Alex proaspat, dimineata, inainte de distractie" },
    ];

    let index = 0;
    const mainImage = document.getElementById("mainImage");
    const photoTitle = document.getElementById("photoTitle");
    const photoDesc = document.getElementById("photoDesc");
    const photoCount = document.getElementById("photoCount");
    const thumbs = document.getElementById("thumbs");
    const lightbox = document.getElementById("lightbox");
    const lightboxImage = document.getElementById("lightboxImage");

    function isLightboxOpen() {
      return lightbox.classList.contains("open");
    }

    function openLightbox() {
      const photo = photos[index];
      lightboxImage.src = photo.src;
      lightboxImage.alt = photo.title;
      lightbox.hidden = false;
      requestAnimationFrame(() => lightbox.classList.add("open"));
      document.body.classList.add("lightbox-open");
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.classList.remove("lightbox-open");
      window.setTimeout(() => {
        if (!isLightboxOpen()) {
          lightbox.hidden = true;
          lightboxImage.removeAttribute("src");
        }
      }, 250);
    }

    function renderThumbs() {
      thumbs.innerHTML = photos.map((photo, i) => `
        <button class="thumb${i === index ? " active" : ""}" type="button" data-index="${i}" aria-label="${photo.title}" aria-current="${i === index ? "true" : "false"}">
          <img src="${photo.src}" alt="" loading="lazy" />
        </button>
      `).join("");
    }

    function show(i) {
      index = (i + photos.length) % photos.length;
      const photo = photos[index];
      mainImage.classList.add("is-switching");
      window.setTimeout(() => {
        mainImage.src = photo.src;
        mainImage.alt = photo.title;
        photoTitle.textContent = photo.title;
        photoDesc.textContent = photo.description;
        photoCount.textContent = `Photo ${index + 1} of ${photos.length}`;
        if (isLightboxOpen()) {
          lightboxImage.src = photo.src;
          lightboxImage.alt = photo.title;
        }
        mainImage.classList.remove("is-switching");
        renderThumbs();
      }, 160);
    }

    thumbs.addEventListener("click", (e) => {
      const btn = e.target.closest(".thumb");
      if (!btn) return;
      show(Number(btn.dataset.index));
    });

    mainImage.addEventListener("click", openLightbox);

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target === lightboxImage || e.target.closest(".lightbox-close")) {
        closeLightbox();
      }
    });

    document.querySelector(".nav-btn.prev").addEventListener("click", () => show(index - 1));
    document.querySelector(".nav-btn.next").addEventListener("click", () => show(index + 1));

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isLightboxOpen()) {
        closeLightbox();
        return;
      }
      if (e.key === "ArrowLeft") show(index - 1);
      if (e.key === "ArrowRight") show(index + 1);
    });

    renderThumbs();
    show(0);
  </script>
</body>
</html>
