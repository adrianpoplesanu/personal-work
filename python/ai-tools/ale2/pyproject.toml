[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ale2"
version = "0.1.0"
description = "ale2 Python project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ale2 = "ale2.main:main"

[tool.setuptools.packages.find]
include = ["ale2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
